name: Atualização Automatizada de Vagas (Dias Úteis - Seg a Sex)

on:
  schedule:
    # Executa todo dia útil (Segunda a Sexta) às 10:11 UTC (período da manhã no Brasil)
    # Horário quebrado (10:11) para evitar sobrecarga/atrasos de fila do GitHub Actions em horários cheios (:00)
    - cron: '11 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar coleta multi-ATS (11 plataformas / 57 canais BR + Global)
        run: node scripts/discover.mjs

      - name: Commit e Push das vagas atualizadas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/liveJobs.json
          git diff --staged --quiet || git commit -m "chore(data): atualização diária automática de vagas (Seg-Sex)"
          git push
