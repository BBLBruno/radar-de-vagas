name: Atualização Automatizada de Vagas (Dias Úteis - Seg a Sex)

on:
  schedule:
    # Executa todo dia útil (Segunda a Sexta) no período da manhã
    # Horários quebrados e fora do topo da hora (:00) para evitar descarte de fila do GitHub Actions
    # Disparo 1 (Início da manhã BR): 07:18 BRT = 10:18 UTC
    - cron: '18 10 * * 1-5'
    # Disparo 2 (Garantia/Segunda chance caso o GitHub atrase na Segunda): 10:24 BRT = 13:24 UTC
    - cron: '24 13 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/update-jobs.yml'

permissions:
  contents: write

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar coleta multi-ATS (11 plataformas / 57 canais BR + Global)
        run: node scripts/discover.mjs

      - name: Commit e Push das vagas atualizadas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/liveJobs.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualização diária automática de vagas (Seg-Sex)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "Nenhuma alteração encontrada nas vagas coletadas hoje."
          fi
