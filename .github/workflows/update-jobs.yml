name: Atualização Automatizada de Vagas (Segunda, Quarta e Sexta)

on:
  schedule:
    # Executa às 09:00 UTC (06:00 BRT) toda Segunda, Quarta e Sexta
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar coleta multi-ATS (Brasil + Internacional 100% Remoto)
        run: node scripts/discover.mjs

      - name: Commit e Push das vagas atualizadas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/liveJobs.json
          git diff --staged --quiet || git commit -m "chore(data): atualização automática de vagas (BR + Global)"
          git push
